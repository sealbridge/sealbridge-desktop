name: Sealbridge G0 contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node branding/generate.mjs --check
      - run: node --test electron/rebrand.node-test.mjs
      - run: node scripts/check-fork-boundaries.mjs
      - run: pnpm exec vitest run scripts/sealbridge-runtime-package.test.mjs
      - run: pnpm exec vitest run scripts/check-fork-boundaries.test.mjs src/components/SealbridgeStatusRow.test.ts src/features/sealbridge/InviteView.test.ts src/features/sealbridge/context-pooling/ContextPoolingView.test.ts src/features/sealbridge/context-pooling/ContextSendPanel.test.ts src/features/sealbridge/context-pooling/ContextReceivePanel.test.ts src/features/sealbridge/context-pooling/ContextReceivedPanel.test.ts src/components/Select.guard.test.ts scripts/testing/file-size-ratchet.test.ts
      - run: node --test electron/sealbridge/context-pooling-pin.node-test.mjs electron/sealbridge/context-pooling.node-test.mjs electron/sealbridge/invites.node-test.mjs electron/preload.node-test.mjs electron/preload-contract.node-test.mjs
      - run: pnpm exec vitest run src/features/sealbridge/DesktopHome.test.ts src/features/sealbridge/WorkplacePanel.test.ts src/state/page-navigation.test.ts
      - run: node --test electron/workplace.node-test.mjs electron/workplace-quit.node-test.mjs
      - run: node scripts/prepare-sealbridge-runtime.mjs
      # The bundled relay client keeps this process alive after the tests pass. Ubuntu otherwise sits until the job is cancelled.
      - run: node --test --test-force-exit electron/sealbridge/key-store-concurrent.node-test.mjs electron/sealbridge/context-receive.node-test.mjs electron/sealbridge/context-redelegation.node-test.mjs electron/sealbridge/context-send.node-test.mjs electron/sealbridge/context-audit.node-test.mjs electron/sealbridge/context-pooling-core.node-test.mjs electron/sealbridge.node-test.mjs electron/sealbridge/bootstrap.node-test.mjs electron/sealbridge/service.node-test.mjs electron/sealbridge/core-invites.node-test.mjs
      - run: pnpm exec electron --test --test-force-exit electron/sealbridge/key-store-concurrent.node-test.mjs electron/sealbridge/context-receive.node-test.mjs electron/sealbridge/context-redelegation.node-test.mjs electron/sealbridge/context-send.node-test.mjs electron/sealbridge/context-audit.node-test.mjs electron/sealbridge/context-pooling-core.node-test.mjs electron/sealbridge/bootstrap.node-test.mjs electron/sealbridge/core-invites.node-test.mjs electron/sealbridge/invites.node-test.mjs
        env:
          ELECTRON_RUN_AS_NODE: "1"
